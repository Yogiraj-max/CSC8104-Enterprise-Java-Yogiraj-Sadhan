# ---- API documentation (Swagger UI at /q/swagger-ui) ----
quarkus.swagger-ui.enable=true
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Flight Booking API (CSC8104)
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Customers, Flights and Bookings for the CSC8104 travel agent coursework.

quarkus.http.test-port=0
quarkus.http.test-ssl-port=0

# ---- Database ----
# This URL lets DBeaver connect while developing. Before Part 3 / cloud deployment change it to
#   quarkus.datasource.jdbc.url=jdbc:h2:mem:default;DB_CLOSE_DELAY=-1
# and remove the H2 TCP server try/catch in Application.java (see the coursework "Warning" box).
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:tcp://localhost/mem:quarkus;DB_CLOSE_ON_EXIT=FALSE
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
