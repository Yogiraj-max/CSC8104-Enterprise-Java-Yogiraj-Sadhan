# =====================================================================================
# CSC8104 Flight Booking Service - application configuration
# =====================================================================================

# ---- API documentation (Swagger UI) ----
# Turn on the Swagger UI page at /q/swagger-ui
quarkus.swagger-ui.enable=true
# Include Swagger UI in the production build too (not just dev mode), so it works on OpenShift
quarkus.swagger-ui.always-include=true
# Title, version and description shown at the top of the Swagger page
quarkus.smallrye-openapi.info-title=Flight Booking API (CSC8104)
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Customers, Flights and Bookings for the CSC8104 travel agent coursework.

# ---- Testing ----
# Run the tests on a random free port, so they don't clash with an app already using 8080
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0

# ---- Database ----
# Use the H2 database engine
quarkus.datasource.db-kind=h2
# In-memory database that lives inside the app. DB_CLOSE_DELAY=-1 keeps the data while the app is running.
# Required for OpenShift (coursework Part 3 warning). All data is lost when the app restarts or is redeployed.
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;DB_CLOSE_DELAY=-1
# Tell Hibernate (JPA) to generate SQL for H2
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
# Drop and recreate the tables from the @Entity classes every time the app starts
quarkus.hibernate-orm.database.generation=drop-and-create
# Print every SQL statement Hibernate runs to the console (useful for debugging)
quarkus.hibernate-orm.log.sql=true

# ---- Part 3: colleagues' services used by the TravelAgent ----
# Each REST client interface (TaxiApi, HotelApi) is linked to its settings by its configKey (taxi-api, hotel-api).
# scope: one shared client instance for the whole app.
# connect-timeout / read-timeout (milliseconds): how long to wait before treating the service as down.
# Their services sleep when idle and can take a while to wake up, hence the generous 30s read timeout.

# Taxi service (Parth Bhawar)
quarkus.rest-client.taxi-api.url=https://ess-coursework-parthrb-dev-dev.apps.rm2.thpm.p1.openshiftapps.com
quarkus.rest-client.taxi-api.scope=javax.enterprise.context.ApplicationScoped
quarkus.rest-client.taxi-api.connect-timeout=10000
quarkus.rest-client.taxi-api.read-timeout=30000

# Hotel service (Sadit Indramangala)
quarkus.rest-client.hotel-api.url=https://csc-8104-sadit-indramangala-saditpond-dev.apps.rm3.7wse.p1.openshiftapps.com
quarkus.rest-client.hotel-api.scope=javax.enterprise.context.ApplicationScoped
quarkus.rest-client.hotel-api.connect-timeout=10000
quarkus.rest-client.hotel-api.read-timeout=30000

# The single customer that represents this travel agent in both colleagues' services.
# All taxi and hotel bookings are made by this customer. It is looked up by email before each booking
# and created again automatically if a colleague's in-memory database has been reset.
# Name: letters and spaces only. Phone: 11 digits starting with 0 (matches both services' validation rules).
travelagent.customer.name=Yogiraj Travel Agent
travelagent.customer.email=yogiraj.travelagent@example.com
travelagent.customer.phone=07000000001